[package]
edition.workspace = true
license.workspace = true
name = "codex-core-workflows"
version.workspace = true

[lib]
doctest = false
name = "codex_core_workflows"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
cap-std = { workspace = true }
codex-code-mode-protocol = { workspace = true }
codex-protocol = { workspace = true }
codex-workflow-journal = { workspace = true }
codex-utils-absolute-path = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt", "rt-multi-thread"] }
